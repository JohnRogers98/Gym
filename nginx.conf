server {
    listen 80;
    server_name gym-buddy.ru localhost;

    # Внутренний DNS Docker-сети для динамического резолвинга
    resolver 127.0.0.11 valid=10s;

    # Общие заголовки
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # 1. UI (Blazor WebAssembly)
    location / {
        set $upstream_ui "http://gym-ui:80";
        proxy_pass $upstream_ui;
    }

    # 2. Backend (WebApi)
    location /api/ {
        set $upstream_backend "http://gym-backend:8080";
        proxy_pass $upstream_backend;
    }

    # 3. BFF
    location /bff/ {
        set $upstream_bff "http://gym-bff:8080";
        rewrite ^/bff/(.*) /$1 break;
        proxy_pass $upstream_bff;
        proxy_set_header X-Forwarded-Prefix /bff;
    }

    # 4. Authorization Server
    location /auth/ {
        set $upstream_auth "http://gym-authserver:8080";
        rewrite ^/auth/(.*) /$1 break;
        proxy_pass $upstream_auth;
        proxy_set_header X-Forwarded-Prefix /auth;
    }

    # 5. Authorization Server Admin
    location /auth-admin/ {
        set $upstream_authadmin "http://gym-authadmin:8080";
        rewrite ^/auth-admin/(.*) /$1 break;
        proxy_pass $upstream_authadmin;
        proxy_set_header X-Forwarded-Prefix /auth-admin;
    }
}