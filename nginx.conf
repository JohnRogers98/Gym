server {
    listen 80;
    server_name gym-buddy.ru localhost;
    return 301 https://$host$request_uri;
}

server{
    listen 443 ssl http2;
    server_name gym-buddy.ru;

    #SSL
    ssl_certificate /etc/nginx/certs/gym-buddy.ru_cert.pem;
    ssl_certificate_key /etc/nginx/certs/gym-buddy.ru_private_key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # 1. Проксирование UI (статика + SPA)
    location / {
        proxy_pass http://ui:80;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 2. Проксирование API к бэкенду
    location /api/ {
        proxy_pass http://backend:8080/api/;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}