
#user  nobody;
worker_processes  2;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
    worker_connections  1024;
}

http {

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
    	listen 80;
    	server_name localhost;
    	return 301 https://$host$request_uri;
    }
    
    server {

	    listen 443 ssl;

	    ssl_certificate C:/Users/User/Desktop/cert/nginx.crt;
            ssl_certificate_key C:/Users/User/Desktop/cert/nginx.key;
    
            ssl_protocols TLSv1.2 TLSv1.3;

	    location / {
            proxy_pass https://localhost:7092/;
	    }

	    location /bff/ {
            proxy_pass https://localhost:7222/;

            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
	    }

          location /chat/ {
            proxy_pass https://localhost:7091;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_buffering off;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 60s;
        }

	    location /auth-server/ {
            proxy_pass https://localhost:7218/;
	        proxy_redirect /Login /auth-server/Login;
	        proxy_redirect /Approve /auth-server/Approve;
	        proxy_redirect /Error /auth-server/Error;
	    }

	    location /auth-server-admin/ {
            proxy_pass https://localhost:7193/;
	    }

	    location /services/ {
            proxy_pass https://localhost:7246/;
	    }
	
    }
}
