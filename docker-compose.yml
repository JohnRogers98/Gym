# docker-compose.yml
version: '3.8'

services:
  mongodb:
    image: mongo:7-jammy
    container_name: gym-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init.js:/mongo-init.js:ro
    command: [--replSet, rs0, --bind_ip_all]
    networks:
      - gym-net
  mongodb-init:
    image: mongo:7-jammy
    depends_on:
      - mongodb
    networks:
      - gym-net
    volumes:
      - ./mongo-init.js:/mongo-init.js:ro
    command: >
      bash -c "
        sleep 10 &&
        mongosh mongodb://gym-mongodb:27017/admin /mongo-init.js
      "

  backend:
    build:
      context: .
      dockerfile: Gym.WebApi/Dockerfile
    container_name: gym-backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - JWT_SECRET=${JWT_SECRET}
      - TG_BOT_TOKEN=${TG_BOT_TOKEN}
      # - WebApplicationUrl=http://gym-buddy.ru
      - ASPNETCORE_URLS=http://+:8080
      #- ASPNETCORE_Kestrel__Certificates__Default__Password=gymgym
      #- ASPNETCORE_Kestrel__Certificates__Default__Path=/https/gym.pfx
    #volumes:
    #- ~/.aspnet/https:/https:ro
    depends_on:
      mongodb-init:
        condition: service_completed_successfully
    networks:
      - gym-net
    restart: always

  ui:
    build:
      context: .
      dockerfile: Gym.WebApplication/Dockerfile
    container_name: gym-ui
    networks:
      - gym-net
    restart: always

  nginx:
    image: nginx:alpine
    container_name: gym-nginx
    ports:
      - "80:80" # ЕДИНСТВЕННЫЙ порт, открытый наружу
      - "443:443" # Если позже добавите SSL
    volumes:
      # Монтируем ваш конфиг из корня проекта
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - ui
      - backend
    networks:
      - gym-net
    restart: always

volumes:
  mongodb_data:

networks:
  gym-net:
    name: gym-net
    driver: bridge