# docker-compose.yml
version: '3.8'

services:
  mongodb:
    image: mongo:7-jammy
    container_name: gym-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init.js:/mongo-init.js:ro
    command: [--replSet, rs0, --bind_ip_all]
    networks:
      - gym-net
  mongodb-init:
    image: mongo:7-jammy
    depends_on:
      - mongodb
    networks:
      - gym-net
    volumes:
      - ./mongo-init.js:/mongo-init.js:ro
    command: >
      bash -c "
        sleep 10 &&
        mongosh mongodb://gym-mongodb:27017/admin /mongo-init.js
      "

  backend:
    build:
      context: .
      dockerfile: Gym.WebApi/Dockerfile
    container_name: gym-backend
    ports:
      - "8080:8080"
      #- "8081:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - JWT_SECRET=${JWT_SECRET}
      - TG_BOT_TOKEN=${TG_BOT_TOKEN}
      - WebApplicationUrl=http://localhost
      #- ASPNETCORE_Kestrel__Certificates__Default__Password=gymgym
      #- ASPNETCORE_Kestrel__Certificates__Default__Path=/https/gym.pfx
    #volumes:
    #- ~/.aspnet/https:/https:ro
    depends_on:
      - mongodb-init
    networks:
      - gym-net

  ui:
    build:
      context: .
      dockerfile: Gym.WebApplication/Dockerfile
    container_name: gym-ui
    ports:
      - "80:80"
    networks:
      - gym-net

volumes:
  mongodb_data:

networks:
  gym-net:
    name: gym-net
    driver: bridge